name: 'AI Code Reviewer by Vecesta.co'
description: 'Autonomous pull request reviewer and security auditor powered by Ollama, Gemini, and OpenAI with quality gates and line-level diff comments.'
author: 'Vecesta.co <vecesta.co@gmail.com>'

inputs:
  github-token:
    description: 'GitHub Token for posting review comments and reading diffs'
    required: true
    default: '${{ github.token }}'
  provider:
    description: 'AI model provider to use: gemini, ollama, openai, or mock'
    required: false
    default: 'gemini'
  model:
    description: 'Specific model identifier (e.g. gemini-1.5-flash, qwen2.5-coder:latest, gpt-4o-mini)'
    required: false
  api-key:
    description: 'API key for Gemini or OpenAI'
    required: false
  api-endpoint:
    description: 'Custom API base URL (for Ollama or OpenAI-compatible endpoints)'
    required: false
  min-severity:
    description: 'Minimum severity to include in comments (SECURITY, CRITICAL, MAJOR, MINOR, NIT)'
    required: false
    default: 'NIT'
  fail-on-severity:
    description: 'Comma-separated severity list that fails the GitHub Action check (e.g. CRITICAL,SECURITY)'
    required: false
  pull-request-number:
    description: 'Optional pull request number override'
    required: false

outputs:
  summary:
    description: 'Executive summary markdown generated by the reviewer'
  findings-count:
    description: 'Total number of findings published'
  passed:
    description: 'Whether the quality gate passed (true/false)'

runs:
  using: 'node20'
  main: 'dist/action.js'

branding:
  icon: 'shield'
  color: 'purple'
